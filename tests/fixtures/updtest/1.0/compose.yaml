# Throwaway update-rollback fixture (Pixel console #243 / idea#243 Remove backup).
# NOT for any release channel, catalog, or school kit. Test only.
x-app:
  name: updtest
  title: Update Test
  description: >
    Throwaway busybox httpd fixture for proving a failed major updateApp leaves
    its temporary system-disk backup in place. NOT for any release channel.
  url: https://github.com/koenswings/agent-app-dev
  category: test
  author: IDEA
  version: "1.0"
  instanceName: updtest
  healthCheck:
    path: /
    expect: "updtest 1.0"
  healthTimeout: 60
  updatesFrom: []
  migrationNote: "Base release of the rollback fixture. No migration."
  snapshotExclude: []
  backup:
    method: stop

services:
  web:
    # Top-level index digest of busybox:1.36.1 (linux/arm64 confirmed via docker manifest inspect).
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: no
    pull_policy: never
    labels:
      x-app-version: "1.0"
    # Serves the version on :8080 and writes a small marker under ./data so the backup has content.
    command: ["/bin/sh", "-c", "mkdir -p /data /www && echo 'updtest 1.0' > /www/index.html && echo 'updtest 1.0 marker' > /data/updtest-marker.txt && date >> /data/visits.log && exec httpd -f -p 8080 -h /www"]
    volumes:
      - ./data:/data
    ports:
      - ${port}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
