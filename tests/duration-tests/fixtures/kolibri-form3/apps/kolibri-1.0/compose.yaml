x-app:
  name: kolibri
  title: Kolibri
  description: >
    Duration-tests fixture (idea#166): Form 3 Kolibri App Disk
    (Variables & expressions topic slice from Khan EN-US).
  url: https://learningequality.org/kolibri/
  category: education
  icon: icon.png
  author: Kid (App Dev Bot)
  version: 1.0-duration-form3
  instanceName: kolibri
services:
  kolibri:
    image: koenswings/kolibri:1.0-0.15.5-dev
    init: true
    restart: no
    pull_policy: never
    volumes:
      - ./data/docker:/docker/mnt
      - ./data/kolibri:/root/.kolibri
    network_mode: "host"
    environment:
      - KOLIBRI_RUN_MODE=docker
      - KOLIBRI_HTTP_PORT=18080
      - KOLIBRI_LISTEN_PORT=18080
