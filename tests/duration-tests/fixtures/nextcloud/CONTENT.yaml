# Stable logical content IDs for duration-tests Nextcloud walks (idea#166).

pack: duration-nextcloud-grade5a
version: "1.2"
diskId: duration-nextcloud-grade5a-001
instanceId: nextcloud-grade5a-001
instanceName: nextcloud
filesMount: true

accounts:
  teacher:
    username: teacher
    logicalId: nc-teacher-grade5a
  learners:
    - username: student01
      logicalId: nc-learner-grade5a-01
    - username: student02
      logicalId: nc-learner-grade5a-02
    - username: student03
      logicalId: nc-learner-grade5a-03

groups:
  - name: Grade 5A
    logicalId: group-grade5a

folders:
  - path: Class Materials
    logicalId: folder-materials-grade5a
    share: view-only
    shareToGroup: Grade 5A
    walkerAction: share_to_class
  - path: Drop Zone
    logicalId: folder-drop-grade5a
    share: file-request
    fileRequestFolder: Drop Zone/inbox     # link targets the subfolder, never the /Drop Zone mount root
    fileRequestToken: grade5adropzone     # created by post-dock-restore-running.sh (teacher, permissions=4); [A-Za-z0-9] only — NC 31.0.1 public uploads break on '-'
    walkerAction: open_file_drop
  - path: Collab
    logicalId: folder-collab-grade5a

collab:
  - path: Collab/Grade5A-collab-notes.md
    logicalId: collab-grade5a-01
    walkerAction: open_collab_doc
    status: text-collab
    editor: nextcloud-text   # shipped + enabled in koenswings/nextcloud:1.0-31.0.1
    notes: >
      Prefer A: Nextcloud Text real-time collaborative Markdown (sessions,
      avatars, autosave) — no Collabora container, no extra image, 0 bytes
      disk impact. Needs the sidecar collab apply (post-dock-restore-running.sh
      provision_nextcloud_collab) so www-data can write the file. Collabora
      (koenswings/nextcloud-code + richdocuments + .odt) stays Prefer B.

urls:
  filesHome: "http://<engine-host>:18280/apps/files/"
  openFileDrop: "logical:folder-drop-grade5a"
  fileRequest: "http://<engine-host>:18280/s/grade5adropzone"   # public upload-only link (teacher) on Drop Zone/inbox; see content/CONTENT.live.json fileRequest
  openCollabDoc: "logical:collab-grade5a-01"
  collabDir: "http://<engine-host>:18280/apps/files/files?dir=/Collab"   # sidecar; docked: dir=/Grade 5A Files/Collab
  shareToClass: "logical:folder-materials-grade5a"

# Phase 3 Intent → content bindings (App-owned). Playwright = Pixel.
phase_3_intent_map:
  open_nextcloud_as_teacher:
    login_username: teacher
    landing: filesHome
  open_nextcloud_as_learner:
    login_username: student01
    landing: filesHome
  browse_folders:
    folderLogicalIds: [folder-materials-grade5a, folder-drop-grade5a, folder-collab-grade5a]
  share_to_class:
    folderLogicalId: folder-materials-grade5a
    group: Grade 5A
    permission: view-only
  done_sharing:
    returns: nc_browse
  open_file_drop:
    folderLogicalId: folder-drop-grade5a
    landing: fileRequest   # public /s/<token> upload page, no login
  after_upload:
    folderLogicalId: folder-drop-grade5a
  open_collab_doc:
    collabLogicalId: collab-grade5a-01
    status: text-collab
    editorSelector: '[data-text-el="editor-container"]'
  close_doc:
    returns: nc_browse
  keep_editing:
    status: text-collab   # was blocked (waiting for Collabora)
    collabLogicalId: collab-grade5a-01
    contentSelector: '[data-text-el="editor-content-wrapper"] .ProseMirror[contenteditable="true"]'
    readonlyBarMustBeAbsent: '[data-text-el="readonly-bar"]'
    sessionAvatars: '.text-editor__session-list .avatar-list'
    requires: collab apply on sidecar (CONTENT.live.json collabProvisioned=true)
