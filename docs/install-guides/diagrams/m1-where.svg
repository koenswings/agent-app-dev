<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="28.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Where to do each step</text><rect x="20" y="50" width="640" height="180" rx="8" fill="#eef5ff" stroke="#333" stroke-width="2"/><text x="340" y="78.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">In Belgium (home internet as 'WAN')</text><text x="40" y="108.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- flash + configure the Cudy (all OpenWrt settings)</text><text x="40" y="123.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- join router + Pis to Tailscale</text><text x="40" y="138.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- set the switch password</text><text x="40" y="153.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- install Raspberry Pi OS + IDEA Engine on both Pis</text><text x="40" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- download App/content (Kolibri, Kiwix ZIMs...)</text><text x="40" y="183.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- full test with the final checklist, then label and pack</text><rect x="690" y="50" width="390" height="180" rx="8" fill="#f0fff0" stroke="#333" stroke-width="2"/><text x="885" y="78.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">On site (with Starlink)</text><text x="710" y="108.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- install dish, activate Starlink</text><text x="710" y="123.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- Starlink app: Bypass mode ON</text><text x="710" y="138.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- cable everything (wiring diagram)</text><text x="710" y="153.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- power on, wait 5 minutes</text><text x="710" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- check Tailscale is back online</text><text x="710" y="183.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#111">- final checklist with a laptop</text></svg>