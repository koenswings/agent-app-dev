0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#111">IDEA-Teachers 10.42.2.1</text><rect x="420" y="60" width="260" height="110" rx="8" fill="#fff7e0" stroke="#333" stroke-width="2"/><text x="550.0" y="86.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">WAN  (Starlink -&gt; internet)</text><text x="550.0" y="108.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">zone: wan</text><rect x="780" y="230" width="290" height="170" rx="8" fill="#f0fff0" stroke="#333" stroke-width="2"/><text x="925.0" y="256.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">LAN  10.42.0.0/24  (wired)</text><text x="925.0" y="278.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">zone: lan</text><text x="925.0" y="291.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">Pi #1 10.42.0.2 - Pi #2 10.42.0.3</text><text x="925.0" y="305.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">switch 10.42.0.4</text><text x="925.0" y="319.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">(Console: http://10.42.0.2)</text><rect x="30" y="130" width="300" height="140" rx="8" fill="#fff0f0" stroke="#333" stroke-width="2"/><text x="180.0" y="156.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Wi-Fi 'IDEA'  10.42.1.0/24</text><text x="180.0" y="178.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">zone: students</text><text x="180.0" y="191.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">laptops / Pi 400s of students</text><text x="180.0" y="205.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">client isolation ON</text><rect x="30" y="380" width="300" height="140" rx="8" fill="#f5f0ff" stroke="#333" stroke-width="2"/><text x="180.0" y="406.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Wi-Fi 'IDEA-Teachers'  10.42.2.0/24</text><text x="180.0" y="428.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">zone: teachers</text><text x="180.0" y="441.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">teacher laptops / phones</text><rect x="420" y="470" width="260" height="110" rx="8" fill="#eefaff" stroke="#333" stroke-width="2"/><text x="550.0" y="496.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">tailscale0</text><text x="550.0" y="518.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">zone: tailscale</text><text x="550.0" y="531.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">admin access to the router only</text><polyline points="330,190 760,190 760,280 780,280" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2ca02c)"/><text x="545" y="183.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2ca02c">ALLOW: to 10.42.0.2 and 10.42.0.3 only</text><polyline points="250,130 250,100 420,100" fill="none" stroke="#d62728" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8,6" marker-end="url(#ah-d62728)"/><text x="30" y="70.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#d62728">BLOCKED (no forwarding):</text><text x="30" y="83.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#d62728">internet, outside DNS, VPNs</text><polyline points="330,430 740,430 740,360 780,360" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2ca02c)"/><text x="545" y="446.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2ca02c">ALLOW: to the two Pis</text><polyline points="200,380 200,330 370,330 370,140 420,140" fill="none" stroke="#ff7f0e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3,5" marker-end="url(#ah-ff7f0e)"/><text x="377" y="230.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#ff7f0e">ON/OFF switch:</text><text x="377" y="243.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#ff7f0e">rule 'Teachers-Internet'</text><polyline points="925,230 925,115 680,115" fill="none" stroke="#2ca02c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2ca02c)"/><text x="930" y="170.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2ca02c">ALLOW: Pi updates</text><text x="930" y="183.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2ca02c">+ Tailscale</text><text x="550" y="400.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">IDEA / Teachers -&gt; router itself: only DHCP + DNS</text><text x="550" y="620.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">Green = allowed, red dashed = blocked, orange dotted = can be switched on/off. Replies to allowed traffic are always let back in.</text></svg>