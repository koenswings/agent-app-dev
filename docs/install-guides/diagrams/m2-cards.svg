<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260"><defs><marker id="ah-1f77b4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="as-1f77b4" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="28.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Preparing many micro-SD cards</text><rect x="15" y="60" width="195" height="150" rx="8" fill="#eef5ff" stroke="#333" stroke-width="2"/><text x="112" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">1. Download once</text><text x="112" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">ubuntu-26.04.1-preinstalled-</text><text x="112" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">desktop-arm64+raspi.img.xz</text><text x="112" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">+ check SHA-256</text><polyline points="212,135 231,135" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1f77b4)"/><rect x="233" y="60" width="195" height="150" rx="8" fill="#fff7e0" stroke="#333" stroke-width="2"/><text x="330" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">2. Write each card</text><text x="330" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">Raspberry Pi Imager</text><text x="330" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">'Use custom' -&gt; the .img.xz</text><text x="330" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">(about 10 min/card)</text><polyline points="430,135 449,135" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1f77b4)"/><rect x="451" y="60" width="195" height="150" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="548" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">3. Label</text><text x="548" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">label: school, PC no.</text><text x="548" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">KEEP the kit 16 GB card</text><text x="548" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">for EEPROM rescue</text><polyline points="648,135 667,135" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1f77b4)"/><rect x="669" y="60" width="195" height="150" rx="8" fill="#f0fff0" stroke="#333" stroke-width="2"/><text x="766" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">4. First boot on Pi 400</text><text x="766" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">setup wizard: language,</text><text x="766" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">keyboard, Wi-Fi, user</text><polyline points="866,135 885,135" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-1f77b4)"/><rect x="887" y="60" width="195" height="150" rx="8" fill="#fff0f0" stroke="#333" stroke-width="2"/><text x="984" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">5. Finish</text><text x="984" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">homepage = Console,</text><text x="984" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">updates, checklist</text><text x="550" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">Optional faster route: set up ONE 'golden' Pi 400, copy its card to an image, write that image to the other cards (section 5.4).</text></svg>