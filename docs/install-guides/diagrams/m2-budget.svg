<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="30.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">USB power budget of a Pi 400 (5 V, current in amps) - from raspberrypi.com docs</text><text x="320" y="92.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#111">Pi 400: max for ALL USB ports together</text><rect x="330" y="74" width="432.0" height="28" rx="2" fill="#2ca02c" stroke="#2ca02c" stroke-width="1"/><text x="770.0" y="93.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111">1.2 A limit</text><text x="320" y="147.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#111">Monitor, typical use (4.5-6.5 W)</text><rect x="330" y="129" width="324.0" height="28" rx="2" fill="#ffe6cc" stroke="#ffe6cc" stroke-width="1"/><rect x="654.0" y="129" width="144.0" height="28" rx="2" fill="#ff7f0e" stroke="#ff7f0e" stroke-width="1"/><text x="806.0" y="148.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111">0.9 - 1.3 A</text><text x="320" y="202.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#111">Monitor 'Full Power mode' needs</text><rect x="330" y="184" width="540.0" height="28" rx="2" fill="#d62728" stroke="#d62728" stroke-width="1"/><text x="878.0" y="203.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111">1.5 A over USB-PD</text><text x="320" y="257.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#111">Mouse (approx.)</text><rect x="330" y="239" width="36.0" height="28" rx="2" fill="#777" stroke="#777" stroke-width="1"/><text x="374.0" y="258.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#111">~0.1 A</text><line x1="762.0" y1="60" x2="762.0" y2="290" stroke="#2ca02c" stroke-width="2" stroke-dasharray="5,4"/><text x="330" y="305.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#555">0.0 A</text><text x="510.0" y="305.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#555">0.5 A</text><text x="690.0" y="305.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#555">1.0 A</text><text x="870.0" y="305.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#555">1.5 A</text><text x="500" y="325.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a00">Conclusion: it works only in Power Saving mode, with nothing else power-hungry on USB. Never force Full Power mode on a Pi 400.</text></svg>