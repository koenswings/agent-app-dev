<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="430" viewBox="0 0 1140 430"><defs><marker id="ah-9467bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9467bd"/></marker><marker id="as-9467bd" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9467bd"/></marker><marker id="ah-2ca02c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ca02c"/></marker><marker id="as-2ca02c" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2ca02c"/></marker><marker id="ah-d62728" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="as-d62728" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="570" y="32.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">What the share gives Justice, and what it does not</text><rect x="20" y="60" width="480" height="320" rx="8" fill="#eef5ff" stroke="#1f77b4" stroke-width="2"/><text x="260" y="88.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f77b4">Koen's tailnet (private network)</text><rect x="45" y="110" width="200" height="50" rx="8" fill="#eeeeee" stroke="#999" stroke-width="1.5"/><text x="145" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#777">Koen's laptop</text><rect x="265" y="110" width="200" height="50" rx="8" fill="#eeeeee" stroke="#999" stroke-width="1.5"/><text x="365" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#777">Koen's phone</text><rect x="45" y="180" width="200" height="50" rx="8" fill="#eeeeee" stroke="#999" stroke-width="1.5"/><text x="145" y="210.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#777">other IDEA Pis</text><rect x="265" y="180" width="200" height="50" rx="8" fill="#eeeeee" stroke="#999" stroke-width="1.5"/><text x="365" y="210.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#777">test machines</text><text x="260" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d62728">Justice cannot see or reach these</text><rect x="130" y="290" width="260" height="70" rx="8" fill="#ffffff" stroke="#1f77b4" stroke-width="3"/><text x="260" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">wizardly-hugle</text><text x="260" y="340.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">shared with Justice only</text><rect x="640" y="60" width="480" height="320" rx="8" fill="#f0fff0" stroke="#2ca02c" stroke-width="2"/><text x="880" y="88.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2ca02c">Justice's own tailnet</text><rect x="665" y="110" width="200" height="50" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="1.5"/><text x="765" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Ubuntu Pi</text><rect x="885" y="110" width="200" height="50" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="1.5"/><text x="985" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">phone / laptop</text><rect x="750" y="290" width="260" height="70" rx="8" fill="#ffffff" stroke="#1f77b4" stroke-width="3" stroke-dasharray="6,4"/><text x="880" y="318.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">wizardly-hugle (shared)</text><text x="880" y="340.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">appears in Justice's list</text><polyline points="392,325 746,325" fill="none" stroke="#9467bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-9467bd)"/><text x="570" y="312.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9467bd">share</text><polyline points="870,165 870,286" fill="none" stroke="#2ca02c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-2ca02c)"/><text x="880" y="225.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2ca02c">Justice's devices can open</text><text x="880" y="238.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#2ca02c">wizardly-hugle's web pages</text><polyline points="780,286 780,168" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,5" marker-end="url(#ah-d62728)"/><text x="770" y="225.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#d62728">wizardly-hugle cannot</text><text x="770" y="238.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#d62728">start connections to</text><text x="770" y="252.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#d62728">Justice's devices</text><text x="570" y="412.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">Koen's other machines stay hidden. Koen can stop the share at any time.</text></svg>