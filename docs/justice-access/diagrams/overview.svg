<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="470" viewBox="0 0 1140 470"><defs><marker id="ah-555" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="as-555" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="ah-9467bd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9467bd"/></marker><marker id="as-9467bd" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9467bd"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="570" y="32.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">How Justice reaches wizardly-hugle</text><rect x="20" y="60" width="300" height="330" rx="8" fill="#f0fff0" stroke="#2ca02c" stroke-width="2" stroke-dasharray="8,5"/><text x="170" y="86.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2ca02c">Justice (Zimbabwe or anywhere)</text><rect x="45" y="105" width="250" height="120" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="170.0" y="133.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Justice's device</text><text x="170.0" y="157.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">Raspberry Pi with Ubuntu,</text><text x="170.0" y="170.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">laptop, phone or tablet</text><text x="170.0" y="184.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">+ Tailscale app</text><rect x="45" y="245" width="250" height="125" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="170" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Web browser</text><text x="170" y="294.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">http://100.115.60.6:8081</text><text x="170" y="307.75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">(IDEA Console)</text><text x="170" y="321.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">Kolibri, Nextcloud, Kiwix</text><polyline points="170,228 170,242" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="570" y="112.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Internet</text><text x="570" y="132.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">(Starlink, mobile data, Wi-Fi...)</text><ellipse cx="570" cy="230" rx="215" ry="85" fill="#f6f1ff" stroke="#9467bd" stroke-width="2"/><polyline points="300,205 840,205" fill="none" stroke="#9467bd" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-9467bd)" marker-start="url(#as-9467bd)"/><text x="570" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9467bd">Tailscale: a private,</text><text x="570" y="258.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9467bd">encrypted tunnel through the internet</text><text x="570" y="345.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555" font-style="italic">Nothing on wizardly-hugle is open to the public internet.</text><rect x="820" y="60" width="300" height="330" rx="8" fill="#eef5ff" stroke="#1f77b4" stroke-width="2" stroke-dasharray="8,5"/><text x="970" y="86.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f77b4">Koen's home (Belgium)</text><rect x="845" y="105" width="250" height="265" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="970" y="132.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">wizardly-hugle</text><text x="970" y="152.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#333">IDEA demo server, 100.115.60.6</text><rect x="865" y="168" width="210" height="30" rx="4" fill="#cfe3ff" stroke="#333" stroke-width="1.2"/><text x="970" y="188.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">IDEA Console  :8081</text><rect x="865" y="206" width="210" height="30" rx="4" fill="#e3f5e3" stroke="#333" stroke-width="1.2"/><text x="970" y="226.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Kolibri  :54189</text><rect x="865" y="244" width="210" height="30" rx="4" fill="#e3f5e3" stroke="#333" stroke-width="1.2"/><text x="970" y="264.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Nextcloud  :50065</text><rect x="865" y="282" width="210" height="30" rx="4" fill="#e3f5e3" stroke="#333" stroke-width="1.2"/><text x="970" y="302.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">Kiwix (Wikipedia)  :61312</text><rect x="865" y="320" width="210" height="30" rx="4" fill="#fbd5d5" stroke="#333" stroke-width="1.2"/><text x="970" y="340.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a00">MilkWise: do not touch</text><text x="570" y="430.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">Justice signs in to Tailscale with his own account. Koen shares only this one machine with him.</text><text x="570" y="452.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">The apps keep their own sign-in: Koen sends the passwords separately.</text></svg>