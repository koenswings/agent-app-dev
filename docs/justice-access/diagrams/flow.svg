<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="520" viewBox="0 0 1140 520"><defs><marker id="ah-555" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="as-555" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="570" y="32.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Getting access: five steps</text><rect x="20" y="55" width="1100" height="200" rx="8" fill="#f0fff0" stroke="#2ca02c" stroke-width="1.5"/><text x="36" y="80.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#2ca02c">JUSTICE</text><rect x="20" y="290" width="1100" height="200" rx="8" fill="#eef5ff" stroke="#1f77b4" stroke-width="1.5"/><text x="36" y="315.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f77b4">KOEN</text><rect x="40" y="95" width="190" height="140" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="2"/><circle cx="62" cy="117" r="13" fill="#2ca02c" stroke="#fff" stroke-width="2"/><text x="62" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="145" y="147.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Create a Tailscale</text><text x="145" y="162.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">account and install</text><text x="145" y="177.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Tailscale (Part B)</text><rect x="260" y="95" width="190" height="140" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="2"/><circle cx="282" cy="117" r="13" fill="#2ca02c" stroke="#fff" stroke-width="2"/><text x="282" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="365" y="147.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Send Koen the</text><text x="365" y="162.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">email address of</text><text x="365" y="177.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">the Tailscale account</text><rect x="480" y="330" width="190" height="140" rx="8" fill="#ffffff" stroke="#1f77b4" stroke-width="2"/><circle cx="502" cy="352" r="13" fill="#1f77b4" stroke="#fff" stroke-width="2"/><text x="502" y="357.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="585" y="382.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Admin console:</text><text x="585" y="397.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Machines &gt; wizardly-hugle</text><text x="585" y="412.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">... menu &gt; Share</text><rect x="700" y="95" width="190" height="140" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="2"/><circle cx="722" cy="117" r="13" fill="#2ca02c" stroke="#fff" stroke-width="2"/><text x="722" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="805" y="147.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">Open the invite</text><text x="805" y="162.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">(email or link)</text><text x="805" y="177.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">and accept it</text><rect x="920" y="95" width="190" height="140" rx="8" fill="#ffffff" stroke="#2ca02c" stroke-width="2"/><circle cx="942" cy="117" r="13" fill="#2ca02c" stroke="#fff" stroke-width="2"/><text x="942" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="1025" y="147.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">wizardly-hugle is</text><text x="1025" y="162.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">in the machine list:</text><text x="1025" y="177.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111">open the Console</text><polyline points="230,165 258,165" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-555)"/><polyline points="355,237 355,400 478,400" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-555)"/><text x="365" y="300.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#555">email address</text><polyline points="672,400 795,400 795,238" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-555)"/><text x="805" y="300.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#555">invite email</text><text x="805" y="312.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#555">or invite link</text><polyline points="890,165 918,165" fill="none" stroke="#555" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-555)"/><text x="905" y="400.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#a00">Later: Koen can revoke</text><text x="905" y="415.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#a00">the share at any time</text><text x="905" y="430.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#a00">(Part A, section 2.3)</text></svg>